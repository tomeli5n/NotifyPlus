name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Kanboard expects the plugin inside a NotifyPlus/ folder
      - name: Compress
        run: git archive HEAD --prefix=NotifyPlus/ --format=zip -o "NotifyPlus-${GITHUB_REF_NAME}.zip" -- . ':!.github' ':!.gitignore'

      # The release may already exist with hand-written notes; only create it if missing
      - name: Publish Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "NotifyPlus-${GITHUB_REF_NAME}.zip" --clobber
